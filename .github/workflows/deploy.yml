name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate brand data
        run: python3 -m json.tool data/brand.json > /dev/null

      - name: Validate shared naming API
        run: |
          node --check naming.js
          node scripts/check-naming.cjs

      - name: Validate shared UI feedback API
        run: |
          node --check ui.js
          node --check app.js
          node scripts/check-ui.cjs

      - name: Validate tournament match-round master
        run: |
          node --check brand.js
          node scripts/check-match-rounds.cjs

      - name: Prepare static website
        run: |
          mkdir -p _site/data
          cp index.html ui.css ui.js app.js brand.js naming.js .nojekyll _site/
          cp data/brand.json _site/data/

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: _site

      - name: Wait for Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        run: |
          for attempt in {1..15}; do
            if count=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" -f name="$ARTIFACT_NAME" --jq '[.artifacts[] | select(.expired == false)] | length'); then
              if [ "$count" = "1" ]; then
                echo "Pages artifact $ARTIFACT_NAME is available."
                exit 0
              fi
              if [ "$count" -gt 1 ]; then
                echo "::error::Multiple artifacts named $ARTIFACT_NAME"
                exit 1
              fi
            fi
            echo "Waiting for artifact metadata (attempt $attempt/15)"
            sleep 4
          done
          echo "::error::Pages artifact $ARTIFACT_NAME did not become available."
          exit 1

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
